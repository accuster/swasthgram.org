name: Deploy sandbox

# Manual, comment-triggered deploy to sbx.swasthgram.org: comment exactly
# "sandbox" on a pull request to deploy that PR's branch there. No deploy
# happens automatically on push or merge.
#
# Only triggers for comments from people with write access to the repo, to
# stop anyone who can comment on a PR from deploying.
#
# Requires the repository secret SBX_DEPLOY_SSH_KEY (see DEPLOY.md).

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write

jobs:
  deploy:
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'sandbox' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    env:
      SERVER_USER: swasthgram-sbx
      SERVER_HOST: 147.93.106.176
      REMOTE_DIR: htdocs/sbx.swasthgram.org
    steps:
      - name: Acknowledge
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "rocket",
            });

      - name: Resolve PR head SHA
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput("sha", pr.data.head.sha);

      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Package deploy payload
        run: |
          set -e
          STAGING=deploy-staging
          mkdir -p "$STAGING/backend/gala" "$STAGING/backend/donation" "$STAGING/backend/migrations"
          cp package.json package-lock.json "$STAGING/"
          cp backend/server.js backend/db.js backend/stripeClient.js backend/mailer.js \
             backend/transactionService.js backend/package.json backend/package-lock.json \
             backend/schema.sql backend/.env.example "$STAGING/backend/"
          cp backend/gala/*.js "$STAGING/backend/gala/"
          cp backend/donation/*.js "$STAGING/backend/donation/"
          cp backend/migrations/*.sql "$STAGING/backend/migrations/"
          cp -r frontend/dist "$STAGING/dist"
          (cd "$STAGING" && zip -rq ../deploy.zip .)

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SBX_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Upload and deploy
        run: |
          set -e
          scp -i ~/.ssh/deploy_key deploy.zip "${SERVER_USER}@${SERVER_HOST}:~/${REMOTE_DIR}/deploy.zip"
          ssh -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" "
            cd ~/${REMOTE_DIR} &&
            unzip -o deploy.zip; rm -f deploy.zip &&
            npm install &&
            (npx pm2 restart swasthgram-sbx-api || npx pm2 start backend/server.js --name swasthgram-sbx-api --cwd ~/${REMOTE_DIR}) &&
            npx pm2 save
          "

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = "${{ job.status }}" === "success";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? "✅ Deployed to https://sbx.swasthgram.org"
                : `❌ Deploy failed — see the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
            });

# ─────────────────────────────────────────────────────────────────────────────
# Add this block INSIDE your existing swasthgram.org server {} block in Nginx
# File location: /etc/nginx/sites-enabled/swasthgram.org.conf
#
# IMPORTANT: CloudPanel overwrites vhost on save.
# Use this command to persist after every CloudPanel save:
#
#   sed -i '/location \/ {/i \
#     location /api/ {\
#         proxy_pass http://127.0.0.1:3002;\
#         proxy_http_version 1.1;\
#         proxy_set_header Host $host;\
#         proxy_set_header X-Real-IP $remote_addr;\
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\
#         proxy_set_header X-Forwarded-Proto $scheme;\
#         proxy_read_timeout 30s;\
#         proxy_connect_timeout 10s;\
#     }\
#   ' /etc/nginx/sites-enabled/swasthgram.org.conf
#
# Then reload Nginx:
#   nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

location /api/ {
    proxy_pass          http://127.0.0.1:3002;
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_read_timeout  30s;
    proxy_connect_timeout 10s;
}
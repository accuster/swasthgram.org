name: Deploy sandbox

# Runs on every push to main, but only actually deploys when the pushed
# commit message contains "[deploy]" (same pattern as beta.eaccuster) —
# every other push to main just no-ops. To deploy: commit straight to main
# with "[deploy]" in the message.

on:
  push:
    branches: [main]

env:
  DEPLOY_TRIGGER: "[deploy]"

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - id: check
        run: |
          COMMIT_MSG=$(cat <<'EOF'
          ${{ github.event.head_commit.message }}
          EOF
          )
          if [[ "$COMMIT_MSG" == *"$DEPLOY_TRIGGER"* ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Commit message did not contain '$DEPLOY_TRIGGER' — skipping sandbox deploy."
          fi

  deploy:
    needs: check-trigger
    if: needs.check-trigger.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      SERVER_USER: swasthgram-sbx
      SERVER_HOST: 147.93.106.176
      REMOTE_DIR: htdocs/sbx.swasthgram.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Package deploy payload
        run: |
          set -e
          STAGING=deploy-staging
          mkdir -p "$STAGING/backend/gala" "$STAGING/backend/donation" "$STAGING/backend/migrations"
          cp package.json package-lock.json "$STAGING/"
          cp backend/server.js backend/db.js backend/stripeClient.js backend/mailer.js backend/webhookRouter.js \
             backend/transactionService.js backend/package.json backend/package-lock.json \
             backend/schema.sql backend/.env.example "$STAGING/backend/"
          cp backend/gala/*.js "$STAGING/backend/gala/"
          cp backend/donation/*.js "$STAGING/backend/donation/"
          cp backend/migrations/*.sql "$STAGING/backend/migrations/"
          cp -r frontend/dist "$STAGING/dist"
          (cd "$STAGING" && zip -rq ../deploy.zip .)

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "${{ secrets.SBX_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan occasionally fails on a transient network blip between
          # the runner and the VPS — retry a few times before giving up.
          for i in 1 2 3 4 5; do
            if ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              break
            fi
            echo "ssh-keyscan attempt $i failed, retrying in 5s..."
            sleep 5
          done
          grep -q "$SERVER_HOST" ~/.ssh/known_hosts || { echo "ssh-keyscan failed after 5 attempts"; exit 1; }

      - name: Upload and deploy
        run: |
          set -e
          scp -i ~/.ssh/deploy_key deploy.zip "${SERVER_USER}@${SERVER_HOST}:~/${REMOTE_DIR}/deploy.zip"
          ssh -i ~/.ssh/deploy_key "${SERVER_USER}@${SERVER_HOST}" "
            cd ~/${REMOTE_DIR} &&
            unzip -o deploy.zip; rm -f deploy.zip &&
            npm install &&
            (npx pm2 restart swasthgram-sbx-api || npx pm2 start backend/server.js --name swasthgram-sbx-api --cwd ~/${REMOTE_DIR}) &&
            npx pm2 save
          "
